name: NMME Extração Histórica CFSv2 (Fase 2C.2)

# Fase 2C.2 — extração histórica completa do CFSv2 (240 inicializações
# mensais, 1991-2010), em 5 LOTES independentes de até 48 inicializações
# cada (scripts/nmme_extracao_historica.py). Preparatória para uma
# eventual avaliação de skill (NÃO feita por este workflow) — reaproveita,
# sem modificação, TODA a orquestração e os guardrails já validados no
# piloto de 16 inicializações (scripts/nmme_piloto_historico.py, run real
# 36145108571, 16/16 aprovadas, rota IRIDL_LEGACY/NMME_HARMONIZED_MONTHLY
# exclusiva).
#
# ARMAZENAMENTO PERMANENTE: cada lote aprovado é COMMITADO no diretório
# da localização selecionada — data/nmme_historico/ (São Bento do
# Tocantins, default) ou data/nmme_historico_fazendas/ (centroide das
# fazendas, lat=-7.80/lon=-47.95) — nunca só artifact do GitHub Actions
# (retenção de 30 dias é insuficiente para um histórico de 20 anos), e
# os dois diretórios nunca se misturam (revisão pontual, 4ª rodada).
# RETOMADA: uma origem já persistida com poc_status=APROVADO E
# localização correta nunca é reconsultada — rodar o mesmo lote/
# localização de novo só retenta o que faltou.
#
# GUARDRAIL DE SEGURANÇA OPERACIONAL: default é dry_run_plan=true,
# executar_lote_real=false — clicar em "Run workflow" sem mexer em nada
# NUNCA acessa a rede NMME: só valida código, roda a suíte de testes,
# mostra o plano dos 5 lotes das DUAS localidades (quantas origens já
# concluídas/pendentes em cada uma). Nunca roda mais de 1 lote/
# localização por execução do workflow — cada lote precisa ser
# disparado explicitamente (Seção 1 da tarefa original: "não executar
# automaticamente a extração completa").
#
# Nunca calcula skill, nunca modifica o dashboard, nunca promove
# nenhuma rota/representação/sistema no catálogo.

on:
  workflow_dispatch:
    inputs:
      dry_run_plan:
        description: 'true (default, seguro) = só valida código/testes e mostra o plano dos 5 lotes das duas localidades — nunca acessa a rede NMME'
        required: true
        default: 'true'
      localizacao:
        description: "Localização alvo de --executar-lote/--consolidar — 'sao_bento' (default, data/nmme_historico/) ou 'fazendas' (data/nmme_historico_fazendas/, centroide lat=-7.80/lon=-47.95)"
        required: true
        type: choice
        default: 'sao_bento'
        options:
          - 'sao_bento'
          - 'fazendas'
      lote_id:
        description: 'Lote a rodar (só usado com executar_lote_real=true) — nunca roda mais de 1 lote por execução'
        required: false
        type: choice
        default: '1991-1994'
        options:
          - '1991-1994'
          - '1995-1998'
          - '1999-2002'
          - '2003-2006'
          - '2007-2010'
      executar_lote_real:
        description: 'true = roda de verdade o lote escolhido, na localização selecionada (só as origens pendentes — retomada automática). Acessa a rede de verdade.'
        required: true
        default: 'false'
      confirm_lote_real:
        description: 'Só necessário com dry_run_plan=false e executar_lote_real=true: digite EXECUTAR_NMME_LOTE para liberar'
        required: false
        default: ''
      consolidar:
        description: 'true = só lê os lotes já persistidos (na localização selecionada) e reporta o estado consolidado — nunca acessa a rede (independente de dry_run_plan)'
        required: true
        default: 'false'

permissions:
  contents: write

concurrency:
  group: nmme-extracao-historica
  cancel-in-progress: false

jobs:
  nmme-extracao-historica:
    name: NMME Extração Histórica (1 lote por execução)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bloqueia a extração real acidental sem confirmação explícita —
      # roda ANTES de instalar dependências ou tocar em qualquer rede.
      - name: Guardrail — lote real exige confirmação explícita
        if: inputs.dry_run_plan != 'true' && inputs.executar_lote_real == 'true'
        run: |
          if [ "${{ inputs.confirm_lote_real }}" != "EXECUTAR_NMME_LOTE" ]; then
            echo "::error::Lote real NMME bloqueado sem confirmação explícita."
            {
              echo "## ❌ Lote real bloqueado"
              echo ""
              echo "Rodar um lote real (Fase 2C.2, extração histórica) exige preencher o"
              echo "input **confirm_lote_real** com o texto exato \`EXECUTAR_NMME_LOTE\`."
              echo ""
              echo "O default (dry_run_plan=true) nunca acessa a rede — só valida código,"
              echo "roda testes e mostra o plano dos 5 lotes."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Confirmação explícita recebida (confirm_lote_real=EXECUTAR_NMME_LOTE) — liberando execução do lote ${{ inputs.lote_id }}."

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências (produção + C3S/NMME)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-c3s.txt

      - name: Rodar suíte de testes existente
        run: python -m unittest discover tests -v

      # Testa a LÓGICA OPERACIONAL do workflow (não só as funções
      # Python) — roda scripts/ci/persistir_e_commitar_historico.sh de
      # verdade (git real) contra um repositório local descartável,
      # cobrindo diretório inicialmente inexistente, execução sem
      # mudanças, push concorrente e as DUAS localidades sem misturar
      # (revisão pontual, 2ª e 4ª rodadas).
      - name: Testar a lógica operacional de persistência/commit (git real, repositório local descartável)
        run: bash tests/test_workflow_extracao_historica.sh

      - name: Verificar integridade do dashboard (produção)
        run: python scripts/verificar_dashboard.py

      # Sempre roda (nunca acessa rede) — mostra quantas origens já
      # estão concluídas (persistidas) e quantas ficam pendentes em
      # cada um dos 5 lotes, para as DUAS localidades lado a lado.
      - name: Mostrar plano da extração (dry-run, nunca acessa a rede NMME)
        run: python scripts/nmme_extracao_historica.py --dry-run-plan

      # Resolve o diretório de armazenamento da localização SELECIONADA
      # (revisão pontual, 4ª rodada, item 2) — nunca hardcoded; usado
      # pelos passos de persistência/publicação de artifact abaixo, que
      # assim NUNCA tocam no diretório da outra localização.
      - name: Resolver diretório da localização selecionada
        id: resolver_diretorio
        run: |
          case "${{ inputs.localizacao }}" in
            fazendas)
              echo "diretorio=data/nmme_historico_fazendas" >> "$GITHUB_OUTPUT" ;;
            sao_bento)
              echo "diretorio=data/nmme_historico" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::localizacao desconhecida: ${{ inputs.localizacao }}"
              exit 1 ;;
          esac
          echo "Localização selecionada: ${{ inputs.localizacao }}"

      # `continue-on-error: true` é o ponto central da revisão pontual
      # (2ª rodada, problema 1): `executar_lote()` já escreve os CSVs
      # no diretório da localização ANTES de reportar reprovação (uma
      # origem reprovada num lote de 48 nunca deve fazer o workflow
      # perder as outras 47 que passaram) — mas sem esta correção, o
      # SystemExit do passo Python interrompia o job inteiro e os
      # passos de commit/push SEGUINTES nunca chegavam a rodar,
      # perdendo os resultados parciais que já estavam no disco do
      # runner. Com `continue-on-error: true`, o job continua até o
      # commit; `steps.executar_lote.outcome` (não `.conclusion`, que
      # fica mascarado como sucesso) ainda registra a reprovação real,
      # usado no passo final para preservar a sinalização.
      #
      # `--localizacao` é repassado explicitamente (revisão pontual, 4ª
      # rodada, item 1) — nunca assumido implicitamente São Bento.
      - name: Rodar lote real (Fase 2C.2 — só origens pendentes deste lote/localização, retomada automática)
        id: executar_lote
        if: inputs.dry_run_plan != 'true' && inputs.executar_lote_real == 'true'
        continue-on-error: true
        run: |
          python scripts/nmme_extracao_historica.py --executar-lote "${{ inputs.lote_id }}" \
            --localizacao "${{ inputs.localizacao }}"

      - name: Consolidação (lê o que já está persistido na localização selecionada — nunca acessa a rede)
        if: inputs.consolidar == 'true'
        run: python scripts/nmme_extracao_historica.py --consolidar --localizacao "${{ inputs.localizacao }}"

      # Armazenamento PERMANENTE — commitado no repositório (nunca só
      # artifact do GitHub Actions, retenção de 30 dias insuficiente
      # para um histórico de 20 anos). Roda SEMPRE que um lote foi
      # tentado, mesmo se `executar_lote` acima foi REPROVADO — a
      # persistência dos resultados parciais aprovados não pode
      # depender do lote inteiro ter sido aprovado (2ª rodada, problema
      # 1). Lógica extraída para scripts/ci/persistir_e_
      # commitar_historico.sh, testada de verdade (git real, sem mock)
      # contra um repositório local em
      # tests/test_workflow_extracao_historica.sh — inclui o caso de o
      # diretório ainda não existir (mkdir -p), push concorrente
      # (pull --rebase) e as duas localidades nunca se misturando (4ª
      # rodada). Recebe o diretório da localização SELECIONADA como 1º
      # argumento — nunca hardcoded para data/nmme_historico/.
      - name: Persistir resultados do lote (commit+push, mesmo se o lote foi reprovado)
        if: inputs.dry_run_plan != 'true' && inputs.executar_lote_real == 'true'
        run: |
          DATA=$(TZ='America/Araguaina' date +'%d/%m/%Y %H:%M BRT')
          bash scripts/ci/persistir_e_commitar_historico.sh \
            "${{ steps.resolver_diretorio.outputs.diretorio }}" "${{ inputs.lote_id }}" "$DATA"

      # Só AGORA, depois de garantir que os resultados parciais (se
      # houver) já foram persistidos/commitados acima, a reprovação do
      # lote é propagada como falha do job — nunca transforma uma
      # execução parcialmente reprovada em sucesso silencioso.
      - name: Sinalizar reprovação do lote (se houver) — depois de persistir os resultados parciais
        if: steps.executar_lote.outcome == 'failure'
        run: |
          echo "::error::Lote ${{ inputs.lote_id }} (${{ inputs.localizacao }}) REPROVADO — os resultados parciais já foram persistidos/commitados no passo anterior; a EXECUÇÃO deste lote não foi aprovada (ver ${{ steps.resolver_diretorio.outputs.diretorio }}/lote_${{ inputs.lote_id }}_resumo_por_origem.csv)."
          exit 1

      # Publica SOMENTE os arquivos da localização selecionada — nome
      # do artifact identifica a localização sem ambiguidade (revisão
      # pontual, 4ª rodada, item 3), path usa o diretório resolvido
      # acima (nunca o caminho fixo de outra localização).
      - name: Publicar artifacts do lote (CSVs/JSON/relatório — cópia de curto prazo, nunca NetCDF/GRIB)
        if: always() && steps.resolver_diretorio.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: nmme-extracao-historica-${{ inputs.localizacao }}-lote-${{ inputs.lote_id }}
          path: |
            ${{ steps.resolver_diretorio.outputs.diretorio }}/lote_${{ inputs.lote_id }}_raw.csv
            ${{ steps.resolver_diretorio.outputs.diretorio }}/lote_${{ inputs.lote_id }}_temporal_audit.csv
            ${{ steps.resolver_diretorio.outputs.diretorio }}/lote_${{ inputs.lote_id }}_access_audit.csv
            ${{ steps.resolver_diretorio.outputs.diretorio }}/lote_${{ inputs.lote_id }}_resumo_por_origem.csv
            ${{ steps.resolver_diretorio.outputs.diretorio }}/lote_${{ inputs.lote_id }}_metadata.json
          retention-days: 30
          if-no-files-found: ignore
