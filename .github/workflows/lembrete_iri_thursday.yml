name: Lembrete — IRI Prediction Plume (janela da 3ª semana)

# CATEGORIA B (ver CLAUDE.md armadilha 9): a fonte é prosa/gráfico, não
# ascii estruturado. NÃO faz parsing de conteúdo — só abre uma Issue
# pra alguém extrair manualmente. Mesmo padrão de
# lembrete_cpc_thursday.yml (janela da 2ª semana), aqui pra 3ª.
#
# Janela, não dia exato: mesmo raciocínio do CPC — travar em "DOW==quinta
# E ordinal==3" dá zero chance de recuperação se esse dia específico
# falhar. Dispara em qualquer dia dentro dos dias 15-21 do mês (a "3ª
# semana"), até 7 tentativas diárias automáticas.
on:
  schedule:
    - cron: '0 15 * * *'   # todo dia, 12h BRT (15h UTC)
  workflow_dispatch:

permissions:
  issues: write

jobs:
  checar_e_lembrar:
    name: Checar janela dos dias 15-21 e abrir Issue
    runs-on: ubuntu-latest
    steps:
      - name: Calcular se hoje está nos dias 15-21 do mês (BRT)
        id: check
        run: |
          DIA=$(TZ='America/Araguaina' date +%-d)
          ORDINAL=$(( (DIA - 1) / 7 + 1 ))
          echo "dia-do-mes=$DIA ordinal=$ORDINAL"
          if [ "$ORDINAL" = "3" ]; then
            echo "na_janela=true" >> "$GITHUB_OUTPUT"
          else
            echo "na_janela=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir Issue de lembrete (se ainda não existir para este mês)
        if: steps.check.outputs.na_janela == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MES_ANO=$(TZ='America/Araguaina' date +'%m/%Y')
          TITULO="Atualizar IRI Prediction Plume — $MES_ANO"

          # Título por MÊS (não por dia) — mesma lógica de dedupe do
          # lembrete_cpc_thursday.yml: uma Issue por mês, aberta ou já
          # fechada, evita recriar nos dias seguintes da mesma janela.
          JA_EXISTE=$(gh issue list --repo "${{ github.repository }}" \
            --search "in:title \"$TITULO\"" --state all --json number \
            --jq 'length')
          if [ "$JA_EXISTE" -gt 0 ]; then
            echo "Issue de $MES_ANO já existe (aberta ou fechada) — nada a fazer"
            exit 0
          fi

          gh issue create --repo "${{ github.repository }}" \
            --title "$TITULO" \
            --body "$(cat <<EOF
          Emissão mensal do IRI Prediction Plume, publicada cerca de 1
          semana depois do CPC (~3ª semana do mês).

          **Fonte (prosa/figura — sem parser, extração manual):**
          https://iri.columbia.edu/our-expertise/climate/forecasts/enso/current/

          ## Checklist de extração

          - [ ] Status ENSO / fase mais provável segundo o plume
          - [ ] Probabilidades por trimestre (modelos dinâmicos x
                estatísticos, **só se publicadas em texto/tabela** — se só
                sair como figura do plume, registrar \`null\` e rotular
                como da emissão anterior; nunca estimar — CLAUDE.md
                armadilha 4)
          - [ ] Divergência CPC × IRI no trimestre corrente (a nota
                \`cpc-iri-rule-note\` do dashboard já mostra isso — conferir
                se ainda bate)
          - [ ] Data da próxima emissão prevista

          ## Depois de extrair

          Atualizar \`CPC_IRI.seasons\` em \`docs/index.html\` manualmente
          (ver CLAUDE.md, armadilhas 3 e 4) e rodar
          \`python scripts/verificar_dashboard.py\` antes de publicar.
          Fechar esta Issue quando terminar.
          EOF
          )"

      - name: Sumário
        if: always()
        run: |
          echo "## 📋 Lembrete IRI Prediction Plume" >> $GITHUB_STEP_SUMMARY
          echo "Hoje está na janela dos dias 15-21 (BRT)? **${{ steps.check.outputs.na_janela }}**" >> $GITHUB_STEP_SUMMARY
