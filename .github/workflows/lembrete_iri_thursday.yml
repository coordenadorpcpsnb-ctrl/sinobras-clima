name: Lembrete — IRI Prediction Plume (3ª quinta-feira)

# CATEGORIA B (ver CLAUDE.md armadilha 9): a fonte é prosa/gráfico, não
# ascii estruturado. NÃO faz parsing de conteúdo — só abre uma Issue
# pra alguém extrair manualmente. Mesmo padrão de
# lembrete_cpc_thursday.yml (2ª quinta-feira), aqui pra 3ª.
on:
  schedule:
    - cron: '0 15 * * *'   # todo dia, 12h BRT (15h UTC)
  workflow_dispatch:

permissions:
  issues: write

jobs:
  checar_e_lembrar:
    name: Checar 3ª quinta-feira e abrir Issue
    runs-on: ubuntu-latest
    steps:
      - name: Calcular se hoje é a 3ª quinta-feira (BRT)
        id: check
        run: |
          DOW=$(TZ='America/Araguaina' date +%u)     # 1=seg … 4=qui … 7=dom
          DIA=$(TZ='America/Araguaina' date +%-d)
          ORDINAL=$(( (DIA - 1) / 7 + 1 ))
          echo "dia-da-semana=$DOW dia-do-mes=$DIA ordinal=$ORDINAL"
          if [ "$DOW" = "4" ] && [ "$ORDINAL" = "3" ]; then
            echo "eh_dia=true" >> "$GITHUB_OUTPUT"
          else
            echo "eh_dia=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir Issue de lembrete
        if: steps.check.outputs.eh_dia == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATA=$(TZ='America/Araguaina' date +'%d/%m/%Y')
          TITULO="Atualizar IRI Prediction Plume — $DATA"

          # Evita Issue duplicada se o workflow for re-executado no mesmo dia
          JA_EXISTE=$(gh issue list --repo "${{ github.repository }}" \
            --search "in:title \"$TITULO\"" --state open --json number \
            --jq 'length')
          if [ "$JA_EXISTE" -gt 0 ]; then
            echo "Issue já existe para hoje — nada a fazer"
            exit 0
          fi

          gh issue create --repo "${{ github.repository }}" \
            --title "$TITULO" \
            --body "$(cat <<EOF
          Emissão mensal do IRI Prediction Plume, publicada cerca de 1
          semana depois do CPC (~3ª quinta-feira do mês).

          **Fonte (prosa/figura — sem parser, extração manual):**
          https://iri.columbia.edu/our-expertise/climate/forecasts/enso/current/

          ## Checklist de extração

          - [ ] Status ENSO / fase mais provável segundo o plume
          - [ ] Probabilidades por trimestre (modelos dinâmicos x
                estatísticos, **só se publicadas em texto/tabela** — se só
                sair como figura do plume, registrar \`null\` e rotular
                como da emissão anterior; nunca estimar — CLAUDE.md
                armadilha 4)
          - [ ] Divergência CPC × IRI no trimestre corrente (a nota
                \`cpc-iri-rule-note\` do dashboard já mostra isso — conferir
                se ainda bate)
          - [ ] Data da próxima emissão prevista

          ## Depois de extrair

          Atualizar \`CPC_IRI.seasons\` em \`docs/index.html\` manualmente
          (ver CLAUDE.md, armadilhas 3 e 4) e rodar
          \`python scripts/verificar_dashboard.py\` antes de publicar.
          Fechar esta Issue quando terminar.
          EOF
          )"

      - name: Sumário
        if: always()
        run: |
          echo "## 📋 Lembrete IRI Prediction Plume" >> $GITHUB_STEP_SUMMARY
          echo "É a 3ª quinta-feira (BRT)? **${{ steps.check.outputs.eh_dia }}**" >> $GITHUB_STEP_SUMMARY
