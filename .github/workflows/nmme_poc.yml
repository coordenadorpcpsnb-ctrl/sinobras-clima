name: NMME Catálogo + POC (Fase 2C.1/2C.1b)

# Fase 2C.1 — catálogo auditável do NMME (North American Multi-Model
# Ensemble), fonte dinâmica sazonal INDEPENDENTE do C3S (Fases 2A-2B).
# ECMWF deliberadamente excluído (Seção 5) — ver scripts/nmme_catalogo.py.
# Fase 2C.1b — primeiro POC REAL, só CFSv2 (scripts/nmme_poc.py::
# executar_poc_real_cfsv2), origem 2005-01, H1-H6, todos os membros, 1
# ponto (São Bento do Tocantins). Nenhum resultado desta fase é
# conclusão científica (Seção 18/35-S — o POC nunca calcula skill,
# nunca usa CHIRPS) nem promove nenhum sistema para produção.
#
# GUARDRAIL DE SEGURANÇA OPERACIONAL: default é dry_run_plan=true,
# executar_poc_real=false — clicar em "Run workflow" sem mexer em nada
# NUNCA acessa a rede NMME: só valida código, roda a suíte de testes,
# mostra catálogo/plano. NMME não exige credencial conhecida (Seção 29
# — fontes públicas oficiais).
#
# Fase 2C.1b (Seção 14): `--executar-poc-real` agora FUNCIONA DE VERDADE
# — passa pelo guardrail (validar_execucao_poc_possivel, exige pelo
# menos 1 sistema com data_access_status em {CONFIRMED,
# POC_READY_DOCUMENTED}, hoje só CFSv2) e então chama
# executar_poc_real_cfsv2(), que baixa um subset real pequeno (1
# origem/H1-H6/1 ponto/todos os membros — nunca o globo nem a série
# completa). Prioriza CCSR_BETA se documentado (hoje nunca é — Seção
# 12, nunca inventa endpoint), cai para IRIDL_LEGACY com fallback
# registrado explicitamente (Seção 2/3/6). O job só aprova/publica como
# sucesso quando scripts/nmme_poc.py::avaliar_aprovacao_poc devolve
# APROVADO (Seção 11) — inclui o mapeamento temporal L<->mês-alvo
# CONFIRMADO a partir dos metadados do próprio arquivo, nunca assumido
# (Seção 6).

on:
  workflow_dispatch:
    inputs:
      dry_run_plan:
        description: 'true (default, seguro) = só valida código/testes e mostra catálogo/plano — nunca acessa a rede NMME'
        required: true
        default: 'true'
      executar_poc_real:
        description: 'true = roda o primeiro POC real (Fase 2C.1b) — só CFSv2, origem 2005-01, H1-H6, sem skill/CHIRPS. Acessa a rede de verdade.'
        required: true
        default: 'false'
      confirm_poc_real:
        description: 'Só necessário com dry_run_plan=false e executar_poc_real=true: digite EXECUTAR_NMME_POC para liberar'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: nmme-poc
  cancel-in-progress: false

jobs:
  nmme-catalogo-poc:
    name: NMME Catálogo + POC
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bloqueia o POC real acidental sem confirmação explícita — roda
      # ANTES de instalar dependências ou tocar em qualquer rede.
      # Pulado quando dry_run_plan=true (default seguro) ou
      # executar_poc_real=false.
      - name: Guardrail — POC real exige confirmação explícita
        if: inputs.dry_run_plan != 'true' && inputs.executar_poc_real == 'true'
        run: |
          if [ "${{ inputs.confirm_poc_real }}" != "EXECUTAR_NMME_POC" ]; then
            echo "::error::POC real NMME bloqueado sem confirmação explícita."
            {
              echo "## ❌ POC real bloqueado"
              echo ""
              echo "Rodar o POC real (download de verdade, Fase 2C.1b) exige preencher o"
              echo "input **confirm_poc_real** com o texto exato \`EXECUTAR_NMME_POC\`."
              echo ""
              echo "O default (dry_run_plan=true) nunca acessa a rede — só valida código,"
              echo "roda testes e mostra o catálogo/plano do POC."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Confirmação explícita recebida (confirm_poc_real=EXECUTAR_NMME_POC) — liberando execução."

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências (produção + C3S/NMME)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-c3s.txt

      - name: Rodar suíte de testes existente
        run: python -m unittest discover tests -v

      - name: Verificar integridade do dashboard (produção)
        run: python scripts/verificar_dashboard.py

      # Sempre roda (nunca acessa rede) — catálogo/plano são dados
      # estáticos do módulo, não dependem de download.
      - name: Mostrar catálogo e plano do POC (dry-run, nunca acessa a rede NMME)
        run: python scripts/nmme_poc.py --dry-run-plan

      - name: Rodar POC real (Fase 2C.1b — só CFSv2, origem 2005-01, H1-H6, sem skill/CHIRPS)
        if: inputs.dry_run_plan != 'true' && inputs.executar_poc_real == 'true'
        run: python scripts/nmme_poc.py --executar-poc-real

      - name: Publicar artifacts (CSVs/JSON/relatório — nunca NetCDF/GRIB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmme-catalogo-poc
          path: |
            artifacts/nmme_poc/nmme_model_catalog.csv
            artifacts/nmme_poc/nmme_common_period.json
            artifacts/nmme_poc/nmme_poc_raw.csv
            artifacts/nmme_poc/nmme_poc_temporal_audit.csv
            artifacts/nmme_poc/nmme_poc_access_audit.csv
            artifacts/nmme_poc/metadata.json
            artifacts/nmme_poc/RELATORIO.md
          retention-days: 30
          if-no-files-found: warn
