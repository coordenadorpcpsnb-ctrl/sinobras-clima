name: C3S Hindcast Completo São Bento

# Fase 2A.3 — hindcast completo SEAS5 / São Bento do Tocantins, 1981-2016
# (período homogêneo de hindcast, 25 membros — nunca misturar com
# real-time forecast pós-2016, 51 membros, já barrado explicitamente em
# scripts/c3s_hindcast_completo.py::validar_intervalo_hindcast). Avaliação
# de SKILL (RAW/BC vs climatologia leakage-safe), não só teste de pipeline
# — isso já foi feito e aprovado na Fase 2A.2.
#
# Mesmo padrão seguro dos workflows C3S anteriores: requer o secret de
# repositório CDS_API_KEY, ~/.cdsapirc temporário nunca commitado/impresso,
# só manual (nunca cron).
#
# GitHub Actions cache para data/c3s_cache/ NÃO está implementado nesta
# primeira versão (Seção 8 da tarefa) — documentado, não implementado.
# Cada execução baixa tudo de novo; não há resume automático entre
# execuções independentes do workflow.
#
# IMPORTANTE: os resultados só são OFICIAIS da Fase 2A.3 com
# start_year=1981/end_year=2016 completo, todos os 12 meses. Uma execução
# parcial (para depuração) é aceita pelo script mas sinalizada como não
# oficial no log/relatório.
#
# GUARDRAIL DE SEGURANÇA OPERACIONAL: o pilot longitudinal foi validado
# em execução real (run 35340386904 — 72/72 origens, 10.800 raw, 432
# summaries, 312 forecasts avaliáveis, leakage 100% aprovado). Este
# workflow prepara o disparo do HINDCAST COMPLETO OFICIAL 1981-2016
# (432 origens) sem tocar em metodologia/C3S/CHIRPS/métricas/produção —
# só simplifica e protege o disparo.
#
# `modo_execucao` (choice) é o único input que controla o que roda:
#   - PILOT (default) — clicar em "Run workflow" sem mexer em nada
#     continua rodando só o pilot longitudinal (72 origens), NUNCA o
#     hindcast completo.
#   - HINDCAST_COMPLETO_1981_2016 — execução oficial (432 origens,
#     1981-2016, todos os 12 meses, sempre — start_year/end_year/
#     init_months são ignorados/forçados, nunca lidos do input humano
#     nesse modo, Seção 10). Exige preencher `confirm_full_hindcast`
#     com o texto exato `EXECUTAR_1981_2016` — sem isso, o job falha
#     antes de instalar qualquer dependência ou criar qualquer request
#     ao CDS (ver step "Guardrail" abaixo).
#
# start_year/end_year/init_months continuam nos inputs só por
# compatibilidade (histórico de execuções manuais) — são ignorados por
# ambos os modos hoje.

on:
  workflow_dispatch:
    inputs:
      modo_execucao:
        description: 'PILOT (default, seguro) = pilot longitudinal (72 origens). HINDCAST_COMPLETO_1981_2016 = execução OFICIAL (432 origens, 1981-2016 fixo) — exige confirm_full_hindcast.'
        type: choice
        required: true
        default: 'PILOT'
        options:
          - PILOT
          - HINDCAST_COMPLETO_1981_2016
      dry_run_plan:
        description: 'true = só mostra o plano de execução, não acessa o CDS'
        required: true
        default: 'false'
      confirm_full_hindcast:
        description: 'Só necessário com modo_execucao=HINDCAST_COMPLETO_1981_2016: digite EXECUTAR_1981_2016 para liberar a execução oficial'
        required: false
        default: ''
      start_year:
        description: 'IGNORADO — mantido só por compatibilidade. modo_execucao=HINDCAST_COMPLETO_1981_2016 sempre força 1981; modo PILOT ignora este campo.'
        required: false
        default: '1981'
      end_year:
        description: 'IGNORADO — mantido só por compatibilidade. modo_execucao=HINDCAST_COMPLETO_1981_2016 sempre força 2016; modo PILOT ignora este campo.'
        required: false
        default: '2016'
      init_months:
        description: 'IGNORADO — mantido só por compatibilidade. modo_execucao=HINDCAST_COMPLETO_1981_2016 sempre roda todos os 12 meses; modo PILOT ignora este campo.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: c3s-hindcast-completo
  cancel-in-progress: false

jobs:
  hindcast-completo:
    name: C3S Hindcast Completo São Bento
    runs-on: ubuntu-latest
    # Job substancialmente maior que a POC/validação multi-origem
    # (até 432 downloads reais) — timeout generoso; se não couber,
    # preferir dividir em blocos via --start-year/--end-year/--init-months
    # (várias execuções manuais) a um workflow monolítico frágil.
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar secret CDS_API_KEY presente
        env:
          CDS_KEY_PRESENTE: ${{ secrets.CDS_API_KEY != '' }}
        run: |
          if [ "$CDS_KEY_PRESENTE" != "true" ]; then
            echo "::error::O secret CDS_API_KEY não está configurado neste repositório."
            {
              echo "## ❌ Secret ausente"
              echo ""
              echo "Configure o secret **CDS_API_KEY** em Settings → Secrets and variables →"
              echo "Actions → New repository secret, com o Personal Access Token da sua conta"
              echo "CDS (https://cds.climate.copernicus.eu). Veja \`docs/c3s-poc.md\` para o"
              echo "passo a passo completo."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Secret CDS_API_KEY está definido (conteúdo nunca exibido neste log)."

      # Bloqueia o hindcast completo oficial acidental sem confirmação
      # explícita — roda ANTES de instalar dependências ou tocar no
      # CDS. Pulado quando dry_run_plan=true (nenhum download de
      # qualquer forma) ou modo_execucao=PILOT (default seguro).
      - name: Guardrail — hindcast completo exige confirmação explícita
        if: inputs.dry_run_plan != 'true' && inputs.modo_execucao == 'HINDCAST_COMPLETO_1981_2016'
        run: |
          if [ "${{ inputs.confirm_full_hindcast }}" != "EXECUTAR_1981_2016" ]; then
            echo "::error::Hindcast completo oficial (modo_execucao=HINDCAST_COMPLETO_1981_2016) bloqueado sem confirmação explícita."
            {
              echo "## ❌ Hindcast completo bloqueado"
              echo ""
              echo "Rodar com **modo_execucao=HINDCAST_COMPLETO_1981_2016** (execução oficial, 432"
              echo "origens reais, 1981-2016) exige preencher o input **confirm_full_hindcast** com"
              echo "o texto exato \`EXECUTAR_1981_2016\`."
              echo ""
              echo "A regra da Fase 2A.3 é: primeiro validar com **modo_execucao=PILOT** (pilot"
              echo "longitudinal, 72 origens — é o default deste workflow, já validado em execução"
              echo "real). Só depois de revisar e aprovar o resultado do piloto é que o hindcast"
              echo "completo oficial deve ser liberado."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Confirmação explícita recebida (confirm_full_hindcast=EXECUTAR_1981_2016) — liberando execução."

      # Seção 11 — resumo claro do modo ANTES da execução real. Números
      # fixos (documentados aqui, não calculados) — não depende de
      # Python nem acessa o CDS.
      - name: Resumo do modo de execução
        run: |
          if [ "${{ inputs.modo_execucao }}" = "HINDCAST_COMPLETO_1981_2016" ]; then
            {
              echo "## MODO: HINDCAST COMPLETO OFICIAL 1981–2016"
              echo ""
              echo "- Origens: 432 (1981-2016, todos os 12 meses)"
              echo "- Leads: 1-6"
              echo "- Membros: 25"
              echo "- Linhas raw esperadas: 64.800"
              echo "- Summaries esperados: 2.592"
              echo "- Período de avaliação: 1991-2016"
              echo "- Warm-up: 1981-1990"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## MODO: PILOT LONGITUDINAL"
              echo ""
              echo "- Origens: 72 (todos jan/jul, 1981-2016)"
              echo "- Leads: 1-6"
              echo "- Membros: 25"
              echo "- Linhas raw esperadas: 10.800"
              echo "- Summaries esperados: 432"
              echo "- Forecasts avaliáveis esperados: 312"
              echo "- Período de avaliação: 1991-2016"
              echo "- Warm-up: 1981-1990"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências (produção + C3S)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-c3s.txt

      - name: Rodar suíte de testes existente
        run: python -m unittest discover tests -v

      - name: Verificar integridade do dashboard (produção)
        run: python scripts/verificar_dashboard.py

      # Reflete exatamente o que a etapa "Rodar hindcast completo" abaixo
      # vai executar — com modo_execucao=PILOT mostra o plano das 72
      # origens do pilot longitudinal; com HINDCAST_COMPLETO_1981_2016
      # mostra o plano oficial de 432 origens, SEMPRE 1981-2016 fixo
      # (Seção 10 — nunca lê start_year/end_year/init_months do input
      # humano neste modo).
      - name: Mostrar plano de execução (dry-run, nunca acessa o CDS)
        run: |
          if [ "${{ inputs.modo_execucao }}" = "HINDCAST_COMPLETO_1981_2016" ]; then
            python scripts/c3s_hindcast_completo.py --start-year 1981 --end-year 2016 --dry-run-plan
          else
            python scripts/c3s_hindcast_completo.py --pilot --dry-run-plan
          fi

      - name: Criar ~/.cdsapirc (temporário, nunca commitado)
        if: inputs.dry_run_plan != 'true'
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          umask 077
          printf 'url: https://cds.climate.copernicus.eu/api\nkey: %s\n' "$CDS_API_KEY" > "$HOME/.cdsapirc"
          chmod 600 "$HOME/.cdsapirc"
          echo "~/.cdsapirc criado (permissão 600, conteúdo nunca exibido)."

      # Sai com código != 0 se a barreira de aprovação reprovar (pilot:
      # validar_pilot_aprovado; oficial: validar_full_aprovado — ambas
      # em c3s_hindcast_completo.py::main()) — os passos seguintes usam
      # if: always() de propósito para rodar mesmo assim. Modo oficial
      # SEMPRE 1981-2016, todos os meses, sem --init-months (Seção 10 —
      # hard-guarded, nunca lê start_year/end_year/init_months aqui).
      - name: Rodar hindcast completo C3S (pilot ou oficial 1981-2016)
        if: inputs.dry_run_plan != 'true'
        run: |
          if [ "${{ inputs.modo_execucao }}" = "HINDCAST_COMPLETO_1981_2016" ]; then
            python scripts/c3s_hindcast_completo.py --start-year 1981 --end-year 2016
          else
            python scripts/c3s_hindcast_completo.py --pilot
          fi

      - name: Remover credencial
        if: always()
        run: rm -f "$HOME/.cdsapirc"

      - name: Publicar artifacts (CSVs/JSON/relatório — nunca GRIB/NetCDF)
        if: always() && inputs.dry_run_plan != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: c3s-hindcast-completo
          path: |
            artifacts/c3s_hindcast/c3s_hindcast_raw.csv
            artifacts/c3s_hindcast/c3s_hindcast_summary.csv
            artifacts/c3s_hindcast/chirps_sao_bento_1981_2016.csv
            artifacts/c3s_hindcast/c3s_hindcast_calibrated.csv
            artifacts/c3s_hindcast/skill_deterministic_overall.csv
            artifacts/c3s_hindcast/skill_deterministic_by_lead.csv
            artifacts/c3s_hindcast/skill_deterministic_by_month.csv
            artifacts/c3s_hindcast/skill_deterministic_by_month_lead.csv
            artifacts/c3s_hindcast/skill_operational_seasons.csv
            artifacts/c3s_hindcast/skill_probabilistic_overall.csv
            artifacts/c3s_hindcast/skill_probabilistic_by_lead.csv
            artifacts/c3s_hindcast/bootstrap_skill.csv
            artifacts/c3s_hindcast/temporal_audit.csv
            artifacts/c3s_hindcast/leakage_audit.csv
            artifacts/c3s_hindcast/metadata.json
            artifacts/c3s_hindcast/RELATORIO.md
          retention-days: 30
          if-no-files-found: warn
