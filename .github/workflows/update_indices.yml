name: Atualização Índices Oceânicos — Dia 21

on:
  # ── Agendamento: dia 21 às 13:00 BRT (16:00 UTC) ──────────────────────
  # Roda 1 hora APÓS o update_dashboard.yml (12:00 BRT)
  # Assim os índices ficam atualizados junto com o modelo SARIMAX
  schedule:
    - cron: '0 16 21 * *'

  # ── Execução manual ────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo da execução manual'
        required: false
        default: 'Atualização manual de índices'

permissions:
  contents: write
  pages:    write
  id-token: write

jobs:
  atualizar-indices:
    name: Buscar índices PSL/NOAA e publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências mínimas
        run: pip install python-dateutil

      - name: Buscar índices oceânicos (PSL/NOAA)
        id: indices
        run: |
          python scripts/update_indices.py
          git diff --quiet docs/index.html && \
            echo "alterado=false" >> $GITHUB_OUTPUT || \
            echo "alterado=true"  >> $GITHUB_OUTPUT
        env:
          TZ: America/Araguaina

      - name: Commit dos índices atualizados
        if: steps.indices.outputs.alterado == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATA=$(TZ='America/Araguaina' date +'%d/%m/%Y %H:%M BRT')
          git add docs/index.html
          git commit -m "auto: índices oceânicos atualizados — $DATA

          - Niño 3.4 mensal (PSL/NOAA nina34.data)
          - ONI calculado (média 3 meses)
          - TSA mensal (PSL/NOAA tsa.data)
          - Niño 3.4 semanal (CPC wksst9120.for)"
          git push

      - name: Preparar pasta para Pages
        if: steps.indices.outputs.alterado == 'true'
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: docs/

      - name: Publicar no GitHub Pages
        if: steps.indices.outputs.alterado == 'true'
        id: deploy
        uses: actions/deploy-pages@v4.0.5

      - name: Sumário
        if: always()
        run: |
          echo "## 🌊 Índices Oceânicos" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Data** | $(TZ='America/Araguaina' date +'%d/%m/%Y %H:%M BRT') |" >> $GITHUB_STEP_SUMMARY
          echo "| **Fontes** | PSL/NOAA nina34.data · tsa.data · CPC wksst9120.for |" >> $GITHUB_STEP_SUMMARY
          echo "| **Alterações** | ${{ steps.indices.outputs.alterado }} |" >> $GITHUB_STEP_SUMMARY
