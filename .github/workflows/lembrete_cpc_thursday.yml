name: Lembrete — CPC ENSO Diagnostic Discussion (janela da 2ª semana)

# CATEGORIA B (ver CLAUDE.md armadilha 9): a fonte é prosa, não ascii
# estruturado. NÃO faz parsing de conteúdo — só abre uma Issue pra
# alguém extrair manualmente. Ver lembrete_iri_thursday.yml para o
# mesmo padrão aplicado ao IRI (janela da 3ª semana).
#
# Janela, não dia exato: o CPC costuma publicar por volta da 2ª
# quinta-feira, mas travar no dia exato (DOW==quinta E ordinal==2)
# significa zero chance de recuperação se esse dia falhar (rede fora,
# runner indisponível, etc.) — só tentaria de novo no mês seguinte.
# Em vez disso, dispara em QUALQUER dia dentro dos dias 8-14 do mês
# (a "2ª semana", independente do dia da semana) — até 7 tentativas
# diárias automáticas dentro do cron já existente, sem precisar de
# lógica de retry separada. A Issue é só um lembrete, não precisa
# bater no minuto exato da publicação.
on:
  schedule:
    - cron: '0 15 * * *'   # todo dia, 12h BRT (15h UTC)
  workflow_dispatch:

permissions:
  issues: write

jobs:
  checar_e_lembrar:
    name: Checar janela dos dias 8-14 e abrir Issue
    runs-on: ubuntu-latest
    steps:
      - name: Calcular se hoje está nos dias 8-14 do mês (BRT)
        id: check
        run: |
          DIA=$(TZ='America/Araguaina' date +%-d)
          ORDINAL=$(( (DIA - 1) / 7 + 1 ))
          echo "dia-do-mes=$DIA ordinal=$ORDINAL"
          if [ "$ORDINAL" = "2" ]; then
            echo "na_janela=true" >> "$GITHUB_OUTPUT"
          else
            echo "na_janela=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir Issue de lembrete (se ainda não existir para este mês)
        if: steps.check.outputs.na_janela == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MES_ANO=$(TZ='America/Araguaina' date +'%m/%Y')
          TITULO="Atualizar CPC ENSO Diagnostic Discussion — $MES_ANO"

          # Título por MÊS (não por dia): assim, se a Issue já foi
          # criada num dia anterior desta mesma janela (aberta OU já
          # fechada — se alguém já fez a extração e fechou, também não
          # deve recriar), os próximos dias da janela não duplicam.
          JA_EXISTE=$(gh issue list --repo "${{ github.repository }}" \
            --search "in:title \"$TITULO\"" --state all --json number \
            --jq 'length')
          if [ "$JA_EXISTE" -gt 0 ]; then
            echo "Issue de $MES_ANO já existe (aberta ou fechada) — nada a fazer"
            exit 0
          fi

          gh issue create --repo "${{ github.repository }}" \
            --title "$TITULO" \
            --body "$(cat <<EOF
          Emissão mensal do CPC ENSO Diagnostic Discussion, publicada por
          volta da 2ª quinta-feira do mês.

          **Fonte (prosa — sem parser, extração manual):**
          https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso_advisory/ensodisc.shtml

          ## Checklist de extração

          - [ ] Status ENSO atual (ex.: "El Niño Advisory", "La Niña Watch")
          - [ ] Synopsis (resumo da situação em 1-2 frases)
          - [ ] Probabilidades de fase ENSO por trimestre (tabela oficial
                CPC/IRI, **só se publicada em texto** — se o CPC só tiver
                soltado a figura, registrar \`null\` e rotular como da
                emissão anterior; nunca estimar — CLAUDE.md armadilha 4)
          - [ ] Data da próxima emissão prevista

          ## Depois de extrair

          Atualizar \`CPC_IRI.seasons\` em \`docs/index.html\` manualmente
          (ver CLAUDE.md, armadilhas 3 e 4) e rodar
          \`python scripts/verificar_dashboard.py\` antes de publicar.
          Fechar esta Issue quando terminar.
          EOF
          )"

      - name: Sumário
        if: always()
        run: |
          echo "## 📋 Lembrete CPC ENSO Diagnostic Discussion" >> $GITHUB_STEP_SUMMARY
          echo "Hoje está na janela dos dias 8-14 (BRT)? **${{ steps.check.outputs.na_janela }}**" >> $GITHUB_STEP_SUMMARY
