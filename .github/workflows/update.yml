name: Atualização Dashboard Clima — Dia 21

on:
  schedule:
    - cron: '0 15 21 * *'   # todo dia 21, 12h BRT (15h UTC)
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo da execução manual'
        required: false
        default: 'Atualização manual'

# Evita colisão com o workflow de publicação. `queue: max` (ENSO-PAGES
# Fase 2) evita que uma 2ª execução pendente deste grupo seja descartada
# pelo comportamento padrão do GitHub Actions (1 execução ativa + só 1
# pendente, com substituição silenciosa de uma pendente por outra mais
# nova) — eleva o limite para até 100 pendentes, processadas em sequência.
# A ordem de processamento segue quando cada execução começou a esperar,
# não necessariamente a ordem de disparo (comportamento documentado do
# GitHub, não testado sob carga real neste repositório). Mesma chave nos
# três workflows do grupo `pages` (ver indices_semanal.yml/publicar.yml).
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  pages:    write
  id-token: write

jobs:
  atualizar:
    name: Buscar dados, recalcular e publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # Referência para decidir a publicação mais abaixo (passo "Verificar
      # necessidade de publicação") — mesmo padrão de indices_semanal.yml.
      - name: Capturar SHA inicial
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── Passo 1: Buscar dados climáticos do mês anterior ──────────────
      - name: Buscar dados Open-Meteo (mês anterior)
        run: python scripts/fetch_monthly_data.py
        env:
          TZ: America/Araguaina

      # ── Passo 2: Atualizar índices oceânicos (PSL/NOAA) ───────────────
      - name: Atualizar índices oceânicos
        run: python scripts/update_indices.py
        env:
          TZ: America/Araguaina

      # ── Passo 3: Recalcular modelo e atualizar dashboard ──────────────
      - name: Recalcular SARIMAX e publicar dashboard
        run: python scripts/update_dashboard.py
        env:
          TZ: America/Araguaina

      # ── Verificação de integridade ────────────────────────────────────
      # Barreira: se os eixos ou as séries estiverem inconsistentes, o job
      # falha AQUI, antes de commitar e publicar. Melhor não atualizar do
      # que publicar um dashboard com gráficos desalinhados.
      - name: Verificar integridade do dashboard
        run: python scripts/verificar_dashboard.py

      # ── Passo 4: Gerar relatório executivo (.docx) ────────────────────
      - name: Gerar relatório executivo
        run: python scripts/gerar_relatorio.py
        env:
          TZ: America/Araguaina

      # ── Commit e deploy ───────────────────────────────────────────────
      - name: Verificar alterações
        id: diff
        run: |
          git diff --quiet docs/ data/ && \
            echo "alterado=false" >> $GITHUB_OUTPUT || \
            echo "alterado=true"  >> $GITHUB_OUTPUT

      # ENSO-PAGES Fase 2C (revisão externa de segurança): só cria o
      # commit LOCAL — nunca empurra aqui. Empurrar só depois que o
      # estado pós-rebase for revalidado (passos abaixo), para nunca
      # enviar a `main` um resultado combinado que não passou pela
      # barreira. `git add` nos mesmos arquivos específicos de sempre
      # (nunca `docs/ data/` indiscriminado).
      - name: Commit local das alterações (sem push)
        if: steps.diff.outputs.alterado == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATA=$(TZ='America/Araguaina' date +'%d/%m/%Y %H:%M BRT')
          MES_ANT=$(TZ='America/Araguaina' date -d '1 month ago' +'%m/%Y')
          git add docs/index.html docs/relatorio-executivo.docx data/
          git commit -m "auto: atualização dashboard — $DATA

          - Dados Open-Meteo ERA5-Land: $MES_ANT incorporados
          - Índices oceânicos atualizados (PSL/NOAA)
          - SARIMAX x XGBoost comparados e melhor selecionado
          - Cenários e BH recalculados
          - Relatório executivo regerado"

      # Passo INCONDICIONAL (roda com ou sem commit local acima) — traz
      # qualquer `docs/`/`data/` publicado por outro workflow do mesmo
      # grupo (ex.: indices_semanal.yml) enquanto este executava. Se
      # houver commit local, o rebase o replica sobre o HEAD remoto
      # atual (ainda sem push); conflito aqui interrompe o job com
      # falha visível (sem `|| true`/continue-on-error) ANTES de
      # qualquer tentativa de push — nunca descarta alteração
      # silenciosamente. Se não houver commit local, é um fast-forward
      # simples, nunca um rebase com conflito. Mesmo padrão de
      # indices_semanal.yml.
      - name: Sincronizar com a main (rebase)
        run: git pull --rebase origin "${GITHUB_REF_NAME}"

      # ENSO-PAGES Fase 2C: revalida o estado pós-rebase ANTES de
      # qualquer push — não reexecuta o pipeline climático (fetch/
      # índices/SARIMAX não rodam de novo), só relê docs/+data/ já no
      # disco (mesmo verificador usado em produção, sem a flag
      # --pular-continuidade-serie-subst, que só existe para
      # indices_semanal.yml). Motivo: o rebase acima pode incorporar
      # docs/index.html de OUTRO workflow do mesmo grupo —
      # indices_semanal.yml também escreve nele (seção Monitor ENSO) —
      # sem conflito textual; o resultado combinado nunca passou pela
      # barreira como um todo, só o docs/index.html que ESTE job gerou
      # isoladamente (passo "Verificar integridade do dashboard", bem
      # acima) foi validado. Reprovar aqui interrompe o job SEM push —
      # o commit local, se houver, nunca sai deste runner efêmero.
      - name: Revalidar integridade antes do push
        run: python scripts/verificar_dashboard.py

      # Só agora, com o estado pós-rebase já revalidado, o push ocorre
      # — e só quando havia algo a commitar. Non-fast-forward aqui
      # falha visivelmente, sem retry automático (nenhum `|| true`).
      - name: Push (quando houver commit local)
        if: steps.diff.outputs.alterado == 'true'
        run: git push

      # Passo INCONDICIONAL — sincroniza de novo para identificar
      # alterações remotas chegadas DEPOIS do push acima (ex.: outra
      # execução do mesmo grupo empurrou entre o nosso push e aqui).
      # Sem commit local pendente neste ponto (já empurramos, se havia
      # algo), isto é sempre um fast-forward simples, nunca um rebase
      # com conflito.
      - name: Sincronizar novamente antes da decisão de publicação
        run: git pull --rebase origin "${GITHUB_REF_NAME}"

      # Verificação final antes do deploy — cobre o que a sincronização
      # acima possa ter trazido depois do nosso próprio push. Mesma
      # barreira, mesmo custo (segundos), nenhum recálculo científico.
      - name: Revalidar integridade antes do deploy
        run: python scripts/verificar_dashboard.py

      # Sinal correto para o deploy — distinto de `steps.diff.outputs.
      # alterado` (que é sobre docs/+data/, calculado ANTES do rebase, e
      # serve só para decidir SE HÁ ALGO A COMMITAR). Compara o SHA do
      # checkout contra o HEAD final só em `docs/`: não publica quando só
      # `data/` mudou (ex.: índices novos sem efeito perceptível no
      # dashboard) nem deixa de publicar uma mudança em `docs/` trazida
      # pelo rebase de outro workflow do mesmo grupo. Cobre tanto
      # docs/index.html quanto docs/relatorio-executivo.docx (ambos sob
      # `docs/`) — uma mudança só no relatório executivo também publica.
      #
      # Limitação registrada, não eliminada (ENSO-PAGES Fase 2, revisão
      # externa): ainda existe uma janela de corrida entre esta checagem e
      # o deploy abaixo — um push concorrente que chegue exatamente nesse
      # intervalo não é refletido neste deploy. Mitigação: com
      # `queue: max` (acima), a próxima execução enfileirada do grupo
      # `pages` roda sua própria sincronização/checagem contra o estado
      # então mais recente e publica o que faltou — não é atomicidade,
      # é convergência pela execução seguinte.
      - name: Verificar necessidade de publicação
        id: publicar_diff
        run: |
          git diff --quiet "${{ steps.base.outputs.sha }}" -- docs/ && \
            echo "mudou=false" >> "$GITHUB_OUTPUT" || \
            echo "mudou=true"  >> "$GITHUB_OUTPUT"

      - name: Preparar para GitHub Pages
        if: steps.publicar_diff.outputs.mudou == 'true'
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: docs/

      - name: Publicar no GitHub Pages
        id: deploy
        if: steps.publicar_diff.outputs.mudou == 'true'
        uses: actions/deploy-pages@v4.0.5

      - name: Sumário
        if: always()
        run: |
          echo "## 📊 Atualização Dashboard Clima" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Data** | $(TZ='America/Araguaina' date +'%d/%m/%Y %H:%M BRT') |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mês incorporado** | $(TZ='America/Araguaina' date -d '1 month ago' +'%m/%Y') |" >> $GITHUB_STEP_SUMMARY
          echo "| **Alterações (commit)** | ${{ steps.diff.outputs.alterado }} |" >> $GITHUB_STEP_SUMMARY
          case "${{ steps.deploy.outcome }}" in
            success)
              echo "| **Publicação (Pages)** | ✅ publicado — ${{ steps.deploy.outputs.page_url }} |" >> $GITHUB_STEP_SUMMARY
              ;;
            skipped|"")
              echo "| **Publicação (Pages)** | ⏭️ pulada — docs/ sem alteração nesta execução (steps.publicar_diff.outputs.mudou=${{ steps.publicar_diff.outputs.mudou }}) |" >> $GITHUB_STEP_SUMMARY
              ;;
            *)
              echo "| **Publicação (Pages)** | ❌ reprovada — havia alteração em docs/ mas o deploy falhou |" >> $GITHUB_STEP_SUMMARY
              ;;
          esac
