name: Atualização Dashboard Clima — 3ª Quinta-feira

on:
  schedule:
    - cron: '0 15 15-21 * 4'   # toda quinta-feira dias 15-21, 15h UTC (12h BRT)

  workflow_dispatch:             # execução manual — sem verificação de data
    inputs:
      motivo:
        description: 'Motivo da execução manual'
        required: false
        default: 'Atualização manual'

permissions:
  contents: write
  pages:    write
  id-token: write

jobs:
  # ── Verificar data apenas no agendamento automático ────────────────────
  verificar-data:
    name: Verificar 3ª quinta-feira
    runs-on: ubuntu-latest
    outputs:
      executar: ${{ steps.check.outputs.executar }}
    steps:
      - name: Checar semana do mês
        id: check
        run: |
          # Execução manual: sempre prosseguir
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "executar=true" >> $GITHUB_OUTPUT
            echo "🔧 Execução manual — prosseguindo"
            exit 0
          fi
          # Agendamento: verificar se é a 3ª quinta-feira (dia 15-21)
          DIA=$(date +%d)
          DIA_SEM=$(date +%u)
          echo "Hoje: dia $DIA, dia_semana=$DIA_SEM"
          if [ "$DIA_SEM" = "4" ] && [ "$DIA" -ge 15 ] && [ "$DIA" -le 21 ]; then
            echo "✅ 3ª quinta-feira confirmada"
            echo "executar=true" >> $GITHUB_OUTPUT
          else
            echo "⏭ Não é a 3ª quinta-feira — pulando"
            echo "executar=false" >> $GITHUB_OUTPUT
          fi

  # ── Recalcular e publicar ───────────────────────────────────────────────
  atualizar:
    name: Recalcular e publicar dashboard
    needs: verificar-data
    if: needs.verificar-data.outputs.executar == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar update_dashboard.py
        run: python scripts/update_dashboard.py
        env:
          TZ: America/Araguaina

      - name: Verificar se houve alterações
        id: diff
        run: |
          git diff --quiet docs/ data/ && \
            echo "alterado=false" >> $GITHUB_OUTPUT || \
            echo "alterado=true"  >> $GITHUB_OUTPUT

      - name: Commit dos dados atualizados
        if: steps.diff.outputs.alterado == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATA=$(TZ='America/Araguaina' date +'%d/%m/%Y %H:%M BRT')
          git add docs/index.html data/
          git commit -m "auto: atualização dashboard — $DATA"
          git push

      - name: Preparar pasta para Pages
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: docs/

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4.0.5

      - name: Sumário da execução
        if: always()
        run: |
          echo "## 📊 Atualização Dashboard Clima" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Data** | $(TZ='America/Araguaina' date +'%d/%m/%Y') |" >> $GITHUB_STEP_SUMMARY
          echo "| **Hora** | $(TZ='America/Araguaina' date +'%H:%M') BRT |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Dashboard:** ${{ steps.deploy.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
