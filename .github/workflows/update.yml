name: Atualização Dashboard Clima — Dia 21

on:
  schedule:
    - cron: '0 15 21 * *'   # todo dia 21, 12h BRT (15h UTC)
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Motivo da execução manual'
        required: false
        default: 'Atualização manual'

# Evita colisão com o workflow de publicação
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read   # leitura padrão do checkout; a escrita usa o token da App (Fase ENSO-APP), nunca este GITHUB_TOKEN
  pages:    write
  id-token: write

jobs:
  atualizar:
    name: Buscar dados, recalcular e publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false   # sem credencial de escrita durante o processamento (Fase ENSO-APP)

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── Passo 1: Buscar dados climáticos do mês anterior ──────────────
      - name: Buscar dados Open-Meteo (mês anterior)
        run: python scripts/fetch_monthly_data.py
        env:
          TZ: America/Araguaina

      # ── Passo 2: Atualizar índices oceânicos (PSL/NOAA) ───────────────
      - name: Atualizar índices oceânicos
        run: python scripts/update_indices.py
        env:
          TZ: America/Araguaina

      # ── Passo 3: Recalcular modelo e atualizar dashboard ──────────────
      - name: Recalcular SARIMAX e publicar dashboard
        run: python scripts/update_dashboard.py
        env:
          TZ: America/Araguaina

      # ── Verificação de integridade ────────────────────────────────────
      # Barreira: se os eixos ou as séries estiverem inconsistentes, o job
      # falha AQUI, antes de commitar e publicar. Melhor não atualizar do
      # que publicar um dashboard com gráficos desalinhados.
      - name: Verificar integridade do dashboard
        run: python scripts/verificar_dashboard.py

      # ── Passo 4: Gerar relatório executivo (.docx) ────────────────────
      - name: Gerar relatório executivo
        run: python scripts/gerar_relatorio.py
        env:
          TZ: America/Araguaina

      # ── Commit e deploy ───────────────────────────────────────────────
      - name: Verificar alterações
        id: diff
        run: |
          git diff --quiet docs/ data/ && \
            echo "alterado=false" >> $GITHUB_OUTPUT || \
            echo "alterado=true"  >> $GITHUB_OUTPUT

      # Mintado só aqui — depois de todo o processamento (fetch, índices,
      # SARIMAX, relatório) e só quando há algo a commitar — nunca antes,
      # para não gastar a validade de 1h do token durante o processamento
      # científico (Fase ENSO-APP, requisito técnico 2).
      - name: Gerar token de instalação da App
        id: app-token
        if: steps.diff.outputs.alterado == 'true'
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.SINOBRAS_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.SINOBRAS_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: sinobras-clima
          permission-contents: write

      # ID numérico da conta bot via API (não é output da action — ver
      # teste aprovado, run 39992875756) — necessário para a identidade
      # de commit no padrão <id>+<slug>[bot]@users.noreply.github.com.
      - name: Resolver identidade da conta bot da App
        id: identidade
        if: steps.diff.outputs.alterado == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -eo pipefail
          resposta="$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${APP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${APP_SLUG}%5Bbot%5D")" \
            || { echo "::error::Falha ao consultar /users/${APP_SLUG}[bot] — ver corpo da resposta acima."; exit 1; }
          bot_id=$(echo "$resposta" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "bot_id=$bot_id" >> "$GITHUB_OUTPUT"

      - name: Commit dos dados atualizados
        if: steps.diff.outputs.alterado == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_ID: ${{ steps.identidade.outputs.bot_id }}
        run: |
          set -eo pipefail

          # Credencial temporária só para este passo — removida mesmo se
          # pull/commit/push falhar (Fase ENSO-APP, requisito técnico 6).
          cleanup() {
            git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          }
          trap cleanup EXIT

          HEADER_VALUE="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::${HEADER_VALUE}"
          git config --local http.https://github.com/.extraheader "${HEADER_VALUE}"

          git config user.name  "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          DATA=$(TZ='America/Araguaina' date +'%d/%m/%Y %H:%M BRT')
          MES_ANT=$(TZ='America/Araguaina' date -d '1 month ago' +'%m/%Y')
          git add docs/index.html docs/relatorio-executivo.docx data/
          git commit -m "auto: atualização dashboard — $DATA

          - Dados Open-Meteo ERA5-Land: $MES_ANT incorporados
          - Índices oceânicos atualizados (PSL/NOAA)
          - SARIMAX x XGBoost comparados e melhor selecionado
          - Cenários e BH recalculados
          - Relatório executivo regerado"
          # Outro workflow do grupo de concorrência "pages" pode ter
          # commitado entre o checkout e aqui — rebase antes de empurrar,
          # com falha explícita se o rebase não resolver sozinho.
          git pull --rebase origin "${GITHUB_REF_NAME}" \
            || { echo "::error::git pull --rebase falhou — não publicando um commit potencialmente não persistido."; exit 1; }
          git push \
            || { echo "::error::git push falhou após o rebase — ver logs acima."; exit 1; }

      - name: Preparar para GitHub Pages
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: docs/

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4.0.5

      - name: Sumário
        if: always()
        run: |
          echo "## 📊 Atualização Dashboard Clima" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Data** | $(TZ='America/Araguaina' date +'%d/%m/%Y %H:%M BRT') |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mês incorporado** | $(TZ='America/Araguaina' date -d '1 month ago' +'%m/%Y') |" >> $GITHUB_STEP_SUMMARY
          echo "| **Alterações** | ${{ steps.diff.outputs.alterado }} |" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Dashboard:** ${{ steps.deploy.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
